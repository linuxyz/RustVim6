# RustVim workspace — Vim rewrite in Rust (reference: vim/vim v8.2.5172)
# Editor core is std-only; the Windows GUI platform layer uses winapi 0.3.
# The M8 encryption/compression code is self-contained (see docs/PLAN.md).
[workspace]
resolver = "2"
members = [
    "bin/rvim",
    "crates/rvim-core",
    "crates/rvim-buffer",
    "crates/rvim-undo",
    "crates/rvim-diff",
    "crates/rvim-syntax",
    "crates/rvim-editor",
    "crates/rvim-ex",
    "crates/rvim-gui",
    "crates/rvim-normal",
    "crates/rvim-cmdline",
    "crates/rvim-viml",
    "crates/rvim-termio",
    "crates/rvim-term",
    "crates/rvim-app",
    "crates/rvim-tools",
]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
license = "Vim"
description = "A Vim-compatible editor written in Rust (std-only core)"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
