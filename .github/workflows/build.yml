name: Build binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build release
        run: cargo build --release --locked

      - name: Fetch Vim runtime
        shell: pwsh
        run: pwsh -NoProfile -File scripts/fetch-reference.ps1

      - name: Package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/package.ps1 -SkipBuild -Target windows -Architecture x64 -Runtime reference/vim/runtime

      - name: Smoke test packaged help
        shell: pwsh
        run: |
          $stage = (Get-ChildItem -Directory target/dist/rvim-*-windows-x64 | Select-Object -First 1).FullName
          pwsh -NoProfile -File scripts/test-package.ps1 -PackageRoot $stage

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: target/dist/rvim-*-windows-x64.zip
          compression-level: 0
          if-no-files-found: error

  linux-x64:
    name: Linux amd64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build release
        # Hosted runners may have an empty Cargo registry; allow locked dependencies to download.
        run: cargo build --release --locked

      - name: Fetch Vim runtime
        shell: pwsh
        run: pwsh -NoProfile -File scripts/fetch-reference.ps1

      - name: Package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/package.ps1 -SkipBuild -Target unix -Architecture x64 -Runtime reference/vim/runtime

      - name: Smoke test packaged help
        shell: pwsh
        run: |
          $stage = (Get-ChildItem -Directory target/dist/rvim-*-linux-x64 | Select-Object -First 1).FullName
          pwsh -NoProfile -File scripts/test-package.ps1 -PackageRoot $stage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: target/dist/rvim-*-linux-x64.tar.gz
          compression-level: 0
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-x64, linux-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "RustVim $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
