name: Build binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build release
        run: cargo build --release --locked

      - name: Fetch Vim runtime
        shell: pwsh
        run: pwsh -NoProfile -File scripts/fetch-reference.ps1

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $stage = "stage-windows"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/rvim.exe $stage
          Copy-Item README.md, LICENSE $stage
          if (Test-Path reference/vim/runtime) {
            Copy-Item reference/vim/runtime $stage/runtime -Recurse
          }
          Compress-Archive -Path "$stage/*" -DestinationPath "rvim-$version-windows-x64.zip" -Force

      - name: Smoke test
        run: .\target\release\rvim.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: rvim-*-windows-x64.zip
          if-no-files-found: error

  linux-x64:
    name: Linux amd64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build release
        run: cargo build --release --locked --offline

      - name: Fetch Vim runtime
        shell: pwsh
        run: pwsh -NoProfile -File scripts/fetch-reference.ps1

      - name: Package
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          STAGE=stage-linux
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp target/release/rvim "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          if [ -d reference/vim/runtime ]; then
            cp -a reference/vim/runtime "$STAGE/runtime"
          fi
          tar -czf "rvim-$VERSION-linux-x64.tar.gz" -C "$STAGE" .

      - name: Smoke test
        run: ./target/release/rvim --version

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: rvim-*-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-x64, linux-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "RustVim $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
